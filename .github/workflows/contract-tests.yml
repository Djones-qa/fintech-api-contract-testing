name: Contract Tests & Pact Broker

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  # ─── Type Check ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

  # ─── Schema Validation Tests ─────────────────────────────────────────────────
  schema-tests:
    name: Zod Schema Validation
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run schema tests
        run: npm run test:schema

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: schema-coverage
          path: coverage/

  # ─── Integration Tests ────────────────────────────────────────────────────────
  integration-tests:
    name: Supertest Integration Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  # ─── OpenAPI Compliance Tests ─────────────────────────────────────────────────
  openapi-tests:
    name: OpenAPI Spec Compliance
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run OpenAPI compliance tests
        run: npm run test:openapi

  # ─── Consumer Contract Tests ──────────────────────────────────────────────────
  consumer-tests:
    name: Pact Consumer Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run consumer contract tests
        run: npm run test:consumer

      - name: Upload pact files
        uses: actions/upload-artifact@v4
        with:
          name: pact-files
          path: pacts/

      - name: Publish pacts to Pact Broker
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
        run: npm run pact:publish

  # ─── Provider Verification ────────────────────────────────────────────────────
  provider-verification:
    name: Pact Provider Verification
    runs-on: ubuntu-latest
    needs: consumer-tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download pact files
        uses: actions/download-artifact@v4
        with:
          name: pact-files
          path: pacts/

      - name: Run provider verification
        run: npm run test:provider

  # ─── Can-I-Deploy Gate ────────────────────────────────────────────────────────
  can-deploy:
    name: Can-I-Deploy Check
    runs-on: ubuntu-latest
    needs: provider-verification
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [PaymentsService, AccountsService]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Can I deploy ${{ matrix.service }}?
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          PACTICIPANT: ${{ matrix.service }}
          GIT_COMMIT: ${{ github.sha }}
          DEPLOY_ENV: production
        run: npm run pact:can-deploy
